run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - unconvert
    - unparam
    - revive
    - gocritic

linters-settings:
  revive:
    rules:
      - name: exported
      - name: package-comments
      - name: blank-imports
      - name: context-as-argument
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: increment-decrement
      - name: var-declaration
      - name: range
      - name: receiver-naming
      - name: indent-error-flow

issues:
  exclude-use-default: true
  exclude-dirs:
    - node_modules
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gocritic
    - linters:
        - revive
      text: "error strings should not be capitalized"
