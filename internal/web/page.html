<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Straightcast</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f3f1eb;
        --paper: #faf9f6;
        --ink: #1c1b16;
        --muted: #5c584f;
        --line: #d9d3c7;
        --live: #1f6b3a;
        --warn: #8a5a12;
        --danger: #8d2b1f;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
        font-size: 15px;
        line-height: 1.45;
      }
      main {
        width: min(680px, 100%);
        margin: 0 auto;
        padding: 22px 16px 48px;
      }
      header {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: flex-end;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--line);
      }
      h1 {
        margin: 0;
        font-size: 1.35rem;
        font-weight: 650;
        letter-spacing: 0;
      }
      .lead {
        margin: 6px 0 0;
        max-width: 36rem;
        color: var(--muted);
      }
      .bar {
        display: flex;
        flex-wrap: nowrap;
        gap: 12px 16px;
        align-items: center;
        justify-content: space-between;
        padding: 14px 0 10px;
      }
      .status {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        flex: 1;
        min-width: 0;
      }
      .mark {
        width: 9px;
        height: 9px;
        margin-top: 6px;
        background: var(--warn);
        flex: none;
      }
      main[data-phase="live"] .mark { background: var(--live); }
      main[data-phase="error"] .mark { background: var(--danger); }
      main[data-phase="stopped"] .mark { background: #8d897f; }
      .phase { margin: 0; font-weight: 650; }
      main[data-phase="live"] .phase { color: var(--live); }
      main[data-phase="error"] .phase { color: var(--danger); }
      .meta, .sub { margin: 2px 0 0; color: var(--muted); font-size: 0.86rem; }
      .sub {
        margin: 0;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--line);
      }
      .actions { display: flex; flex-wrap: wrap; gap: 8px; }
      button, input, select { font: inherit; color: var(--ink); }
      button {
        min-height: 40px;
        padding: 6px 14px;
        border: 1px solid var(--ink);
        border-radius: 2px;
        background: var(--ink);
        color: var(--paper);
        cursor: pointer;
      }
      button.ghost {
        background: transparent;
        color: var(--ink);
      }
      button:disabled { opacity: 0.4; cursor: default; }
      button:focus-visible, input:focus-visible, select:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }
      .alert {
        margin: 12px 0 0;
        padding: 8px 0;
        color: var(--danger);
        overflow-wrap: anywhere;
      }
      .urls { margin: 0; padding: 0; list-style: none; }
      .urls li {
        display: grid;
        grid-template-columns: 4.5rem 1fr auto;
        gap: 2px 12px;
        align-items: center;
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
      }
      .urls h2 { margin: 0; font-size: 0.95rem; font-weight: 650; }
      .urls .hint {
        grid-column: 2 / -1;
        margin: 0;
        color: var(--muted);
        font-size: 0.82rem;
      }
      .url {
        margin: 0;
        font-family: ui-monospace, "SFMono-Regular", "Cascadia Code", monospace;
        font-size: 0.86rem;
        overflow-wrap: anywhere;
      }
      form { padding-top: 14px; }
      .fields {
        display: grid;
        gap: 12px 16px;
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        color: var(--muted);
        font-size: 0.82rem;
        min-width: 0;
      }
      input, select {
        width: 100%;
        min-height: 40px;
        padding: 6px 8px;
        border: 1px solid var(--line);
        border-radius: 2px;
        background: var(--paper);
      }
      .hint { margin: 12px 0 0; color: var(--muted); font-size: 0.86rem; }
      .foot {
        margin: 22px 0 0;
        padding-top: 12px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.82rem;
      }
      @media (min-width: 720px) {
        .fields { grid-template-columns: 1fr 1fr 1fr; }
      }
      @media (max-width: 640px) {
        .urls li { grid-template-columns: 1fr auto; }
        .urls h2, .urls .hint { grid-column: 1 / -1; }
      }
    </style>
  </head>
  <body>
    <main data-phase="starting">
      <header>
        <div>
          <h1>Straightcast</h1>
          <p class="lead">このPCの画面をH.264のRTSPにします。</p>
        </div>
      </header>

      <div class="bar">
        <div class="status" role="status" aria-live="polite">
          <span class="mark" aria-hidden="true"></span>
          <div>
            <p class="phase" id="phase">起動中</p>
            <p class="meta" id="meta"></p>
          </div>
        </div>
        <div class="actions">
          <button type="submit" form="form" id="apply">配信を開始</button>
          <button type="button" class="ghost" id="stop">停止</button>
        </div>
      </div>
      <p class="sub" id="note">MediaMTXを待っています。</p>
      <p class="alert" id="alert" role="alert" hidden></p>

      <ul class="urls">
        <li>
          <h2>rtspt</h2>
          <p class="url" id="tcp-url">準備中</p>
          <button type="button" class="ghost" id="copy-tcp">コピー</button>
          <p class="hint">TCPです。同じPCで受けるならこちらを使ってください。</p>
        </li>
        <li>
          <h2>rtsp</h2>
          <p class="url" id="udp-url">準備中</p>
          <button type="button" class="ghost" id="copy-udp">コピー</button>
          <p class="hint">UDPです。届かないことがあります。</p>
        </li>
      </ul>

      <form id="form">
        <div class="fields">
          <label>配信ID
            <input id="stream-id" name="id" autocomplete="off" spellcheck="false" required pattern="[a-z0-9][a-z0-9-]{2,62}" />
          </label>
          <label>ホスト
            <input id="host" name="host" autocomplete="off" spellcheck="false" value="127.0.0.1" />
          </label>
          <label>フレームレート
            <select id="fps" name="fps">
              <option value="15">15</option>
              <option value="24">24</option>
              <option value="30" selected>30</option>
              <option value="60">60</option>
            </select>
          </label>
          <label>ビットレート（kbps）
            <input id="bitrate" name="bitrate" type="number" min="800" max="12000" step="100" value="2500" />
          </label>
          <label>モニター（0がメイン）
            <input id="monitor" name="monitor" type="number" min="0" max="8" step="1" value="0" />
          </label>
          <label>エンコーダ
            <select id="encoder" name="encoder">
              <option value="auto" selected>自動</option>
              <option value="nvenc">NVIDIA NVENC</option>
              <option value="qsv">Intel Quick Sync</option>
              <option value="amf">AMD AMF</option>
              <option value="libx264">libx264</option>
            </select>
          </label>
        </div>
        <p class="hint">待ちは約1フレームです。30fpsでは約33msです。60fpsでは約17msで、処理は2倍になります。</p>
      </form>
      <p class="foot">キーフレームは約1秒です。プレビューはありません。</p>
    </main>
    <script>
      const phaseText = {
        starting: "起動中",
        live: "配信中",
        stopped: "停止",
        error: "失敗",
      }
      const main = document.querySelector("main")
      const alertBox = document.getElementById("alert")
      let formReady = false
      let urls = { tcp: "", udp: "" }

      function val(id) {
        return document.getElementById(id).value.trim()
      }

      function settings() {
        return {
          id: val("stream-id"),
          host: val("host"),
          fps: Number(val("fps")),
          bitrateKbps: Number(val("bitrate")),
          monitor: Number(val("monitor")),
          encoder: val("encoder"),
        }
      }

      function showError(text) {
        if (!text) {
          alertBox.hidden = true
          alertBox.textContent = ""
          return
        }
        alertBox.hidden = false
        alertBox.textContent = text
      }

      function render(data) {
        const phase = data.phase || "starting"
        main.dataset.phase = phase
        document.getElementById("phase").textContent = phaseText[phase] || phase
        document.getElementById("note").textContent = data.note || ""
        const meta = [data.encoderLabel, data.sourceLabel].filter(Boolean).join(" / ")
        document.getElementById("meta").textContent = meta
        document.getElementById("tcp-url").textContent = data.tcpUrl || "まだありません"
        document.getElementById("udp-url").textContent = data.udpUrl || "まだありません"
        urls = { tcp: data.tcpUrl || "", udp: data.udpUrl || "" }
        showError(data.error || "")
        document.getElementById("apply").textContent = phase === "live" || phase === "starting" ? "設定を反映" : "配信を開始"
        document.getElementById("stop").disabled = phase === "stopped" || phase === "starting"
        if (!formReady && data.id) {
          document.getElementById("stream-id").value = data.id
          document.getElementById("host").value = data.host || "127.0.0.1"
          document.getElementById("fps").value = String(data.fps || 30)
          document.getElementById("bitrate").value = String(data.bitrateKbps || 2500)
          document.getElementById("monitor").value = String(data.monitor || 0)
          document.getElementById("encoder").value = data.encoder || "auto"
          formReady = true
        }
      }

      async function refresh() {
        try {
          const response = await fetch("/api/status", { cache: "no-store" })
          render(await response.json())
        } catch (error) {
          showError("画面を更新できません。" + error.message)
        }
      }

      async function copyText(text, button) {
        if (!text) return
        try {
          await navigator.clipboard.writeText(text)
        } catch {
          const area = document.createElement("textarea")
          area.value = text
          document.body.appendChild(area)
          area.select()
          document.execCommand("copy")
          area.remove()
        }
        const previous = button.textContent
        button.textContent = "コピーしました"
        setTimeout(() => {
          button.textContent = previous
        }, 1400)
      }

      document.getElementById("copy-tcp").addEventListener("click", (event) => {
        copyText(urls.tcp, event.currentTarget)
      })
      document.getElementById("copy-udp").addEventListener("click", (event) => {
        copyText(urls.udp, event.currentTarget)
      })
      document.getElementById("form").addEventListener("submit", async (event) => {
        event.preventDefault()
        showError("")
        const response = await fetch("/api/start", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(settings()),
        })
        const body = await response.json().catch(() => ({}))
        if (!response.ok) showError(body.error || "設定を反映できません")
        await refresh()
      })
      document.getElementById("stop").addEventListener("click", async () => {
        await fetch("/api/stop", { method: "POST" })
        await refresh()
      })
      refresh()
      setInterval(refresh, 2000)
    </script>
  </body>
</html>
