name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - run: go test -race ./cmd/... ./internal/...
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          args: --timeout=5m

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -eu
          binary=straightcast
          if [ "$GOOS" = "windows" ]; then
            binary=straightcast.exe
          fi
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/${binary}" ./cmd/straightcast
          archive="straightcast_${GOOS}_${GOARCH}"
          if [ "$GOOS" = "windows" ]; then
            (cd dist && zip "../${archive}.zip" "$binary")
          else
            tar -C dist -czf "${archive}.tar.gz" "$binary"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: straightcast-${{ matrix.goos }}-${{ matrix.goarch }}
          path: straightcast_${{ matrix.goos }}_${{ matrix.goarch }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body: |
            同じ PC の中で画面を RTSP にします。ブラウザのエンコーダも、ネットの往復も通りません。

            Windows では `straightcast_windows_amd64.zip` を展開し、`straightcast.exe` を起動してください。ffmpeg は入っていません。[gyan.dev の essentials](https://www.gyan.dev/ffmpeg/builds/) を PATH に通すか、exe の隣の `bin/ffmpeg.exe` に置いてください。`ddagrab` と `h264_nvenc` が入っているビルドが必要です。

            MediaMTX が無いときは、初回起動で公式リリースを `bin/` に取得します。

            制御画面は http://127.0.0.1:43123 です。表示された `rtspt://`（TCP）が短い経路です。
